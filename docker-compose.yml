version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: base-spring-postgres
    environment:
      POSTGRES_DB: basedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
