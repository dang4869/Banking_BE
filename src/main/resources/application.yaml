spring:
  application:
    name: banking-api

  profiles:
    active: dev   # Đổi thành 'prod' khi deploy lên server

  # JPA/Hibernate — cấu hình chung cho tất cả môi trường
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Server Configuration
server:
  port: 8000
  servlet:
    context-path: /

# JWT Configuration — dùng chung, override ở từng profile nếu cần
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 900000        # 15 phút
  refresh-expiration: 604800000   # 7 ngày

security:
  max-refresh-tokens-per-user: 5
